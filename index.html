
<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statusmenu</title>

  <style>
    :root {
      color-scheme: light dark;
      --panel: #202124;
      --panel-border: #3b3d42;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --hover: #303238;
      --field: #292b30;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --panel: #ffffff;
        --panel-border: #e5e7eb;
        --text: #202124;
        --muted: #71717a;
        --hover: #f3f4f6;
        --field: #ffffff;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font: 14px/1.4 system-ui, sans-serif;
      color: var(--text);
      display: inline-block;
      min-width: 230px;
    }

    .wrap {
      position: relative;
      display: inline-block;
    }

    .trigger {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 170px;
      max-width: 240px;
      padding: 8px 11px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .trigger:hover { background: var(--hover); }

    .trigger-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      color: var(--muted);
      font-size: 11px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 9px;
      background: var(--dot, #9ca3af);
    }

    .menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + 7px);
      left: 0;
      width: 265px;
      padding: 7px;
      border: 1px solid var(--panel-border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 12px 32px rgba(0,0,0,.22);
    }

    .menu[hidden], .editor[hidden] {
      display: none;
    }

    .menu-heading {
      padding: 7px 9px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .option:hover,
    .option[aria-checked="true"] {
      background: var(--hover);
    }

    .option-name { flex: 1; }
    .check { color: var(--muted); }

    .manage {
      margin-top: 5px;
      padding-top: 7px;
      border-top: 1px solid var(--panel-border);
    }

    .manage-toggle {
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .manage-toggle:hover {
      background: var(--hover);
      color: var(--text);
    }

    .editor { padding: 7px 5px 3px; }

    .editor-row {
      display: flex;
      gap: 6px;
      margin: 6px 0;
    }

    .editor input {
      min-width: 0;
      flex: 1;
      padding: 7px 8px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      font: inherit;
    }

    .small-btn {
      padding: 6px 8px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      cursor: pointer;
    }

    .hint {
      margin: 7px 3px 2px;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>

<body>
<div class="wrap">

  <button class="trigger" id="trigger" type="button"
    aria-haspopup="true" aria-expanded="false">
    <span class="dot" id="currentDot"></span>
    <span class="trigger-label" id="currentLabel">Niet uitgevoerd</span>
    <span class="chevron">▾</span>
  </button>

  <div class="menu" id="menu" hidden role="menu">
    <div class="menu-heading">Status</div>
    <div id="options"></div>

    <div class="manage">
      <button class="manage-toggle" id="manageToggle" type="button">
        ⚙ Statusopties beheren
      </button>

      <div class="editor" id="editor" hidden>
        <div class="editor-row">
          <input id="newName" type="text" maxlength="32"
            placeholder="Nieuwe status…" aria-label="Nieuwe status">
          <button class="small-btn" id="addBtn" type="button">
            Toevoegen
          </button>
        </div>

        <div id="editOptions"></div>
        <p class="hint">Wijzigingen worden gedeeld met collega's.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* SUPABASE */
const SUPABASE_URL = "https://irzgsroupnkiiyqrftxm.supabase.co";
const SUPABASE_KEY = "sb_publishable_CJr9UJWnPUwfEOZyS1LzXg_mwgTdfiL";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/*
  BELANGRIJK:
  Iedere dropdown krijgt een eigen page_id via de URL.
  Bijvoorbeeld:
  ?page_id=taak-1
  ?page_id=taak-2
*/
const params = new URLSearchParams(window.location.search);
const pageId = params.get("page_id");

if (!pageId) {
  document.body.textContent =
    "Fout: er ontbreekt een page_id in de URL.";
  throw new Error("Geen page_id opgegeven");
}

/* STANDAARD STATUSSEN */
const defaults = [
  { id: "Niet uitgevoerd", name: "Niet uitgevoerd", color: "#9ca3af" },
  { id: "Ja", name: "Ja", color: "#22c55e" },
  { id: "Nee", name: "Nee", color: "#ef4444" },
  { id: "In behandeling", name: "In behandeling", color: "#3b82f6" },
  { id: "Aandachtspunt", name: "Aandachtspunt", color: "#f97316" }
];

let statuses = defaults.map(s => ({ ...s }));
let selected = "Niet uitgevoerd";
let ready = false;

/*
  Opslagverzoeken worden achter elkaar uitgevoerd.
  Zo worden snelle wijzigingen niet overgeslagen.
*/
let saveQueue = Promise.resolve();

const trigger = document.getElementById("trigger");
const menu = document.getElementById("menu");
const options = document.getElementById("options");
const currentDot = document.getElementById("currentDot");
const currentLabel = document.getElementById("currentLabel");
const editor = document.getElementById("editor");

/* WEERGAVE */
function render() {
  const current = statuses.find(s => s.id === selected) || statuses[0];

  if (!current) return;

  currentLabel.textContent = current.name;
  currentDot.style.setProperty("--dot", current.color);

  options.replaceChildren();

  statuses.forEach(status => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.setAttribute("role", "menuitemradio");
    button.setAttribute(
      "aria-checked",
      String(status.id === selected)
    );

    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.setProperty("--dot", status.color);

    const name = document.createElement("span");
    name.className = "option-name";
    name.textContent = status.name;

    const check = document.createElement("span");
    check.className = "check";
    check.textContent = status.id === selected ? "✓" : "";

    button.append(dot, name, check);

    button.addEventListener("click", async () => {
      /*
        Alleen de geselecteerde status verandert.
        De andere statusopties blijven bestaan.
      */
      selected = status.id;

      render();
      closeMenu();

      await persist();
    });

    options.append(button);
  });

  renderEditor();
}

/* STATUSOPTIES BEHEREN */
function renderEditor() {
  const list = document.getElementById("editOptions");
  list.replaceChildren();

  statuses.forEach(status => {
    const row = document.createElement("div");
    row.className = "editor-row";

    const name = document.createElement("input");
    name.value = status.name;
    name.setAttribute("aria-label", "Naam van " + status.name);

    name.addEventListener("change", async () => {
      const value = name.value.trim();

      if (value) {
        status.name = value;
      } else {
        name.value = status.name;
      }

      render();
      await persist();
    });

    const color = document.createElement("input");
    color.type = "color";
    color.value = status.color;
    color.title = "Kleur aanpassen";
    color.style.flex = "0 0 38px";
    color.style.padding = "2px";

    color.addEventListener("change", async () => {
      status.color = color.value;

      render();
      await persist();
    });

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "small-btn";
    remove.textContent = "×";
    remove.title = "Status verwijderen";

    remove.addEventListener("click", async () => {
      if (statuses.length <= 1) return;

      statuses = statuses.filter(s => s.id !== status.id);

      // Alleen als de gekozen status verwijderd wordt,
      // kiezen we een andere status.
      if (selected === status.id) {
        selected = statuses[0].id;
      }

      render();
      await persist();
    });

    row.append(name, color, remove);
    list.append(row);
  });
}

/* OPSLAAN IN SUPABASE */
function persist() {
  if (!ready) return Promise.resolve();

  // Maak een momentopname van deze wijziging.
  const snapshot = {
    page_id: pageId,
    selected: selected,
    statuses: statuses.map(s => ({ ...s })),
    updated_at: new Date().toISOString()
  };

  const saveTask = saveQueue.then(async () => {
    const { error } = await db
      .from("outline_statuses")
      .upsert(snapshot, {
        onConflict: "page_id"
      });

    if (error) throw error;
  });

  saveQueue = saveTask.catch(error => {
    console.error("Opslaan mislukt:", error);
    alert("Opslaan mislukt. Controleer de databaseverbinding.");
  });

  return saveQueue;
}

/* STATUS OPHALEN */
async function loadStatus() {
  const { data, error } = await db
    .from("outline_statuses")
    .select("*")
    .eq("page_id", pageId)
    .maybeSingle();

  if (error) {
    console.error("Ophalen mislukt:", error);
    alert("Status ophalen mislukt. Controleer de Supabase-instellingen.");
    return;
  }

  if (data) {
    if (Array.isArray(data.statuses) && data.statuses.length > 0) {
      statuses = data.statuses;
    } else {
      statuses = defaults.map(s => ({ ...s }));
    }

    // Bestaande handmatige keuze behouden.
    selected = statuses.some(s => s.id === data.selected)
      ? data.selected
      : (statuses.find(s => s.id === "Niet uitgevoerd")?.id
          || statuses[0].id);

  } else {
    // Nieuwe dropdown: altijd beginnen op Niet uitgevoerd.
    statuses = defaults.map(s => ({ ...s }));
    selected = "Niet uitgevoerd";
  }

  ready = true;
  render();

  // Alleen bij de eerste keer een record aanmaken.
  if (!data) {
    await persist();
  }
}

/* MENU OPENEN EN SLUITEN */
function closeMenu() {
  menu.hidden = true;
  trigger.setAttribute("aria-expanded", "false");
}

trigger.addEventListener("click", () => {
  menu.hidden = !menu.hidden;
  trigger.setAttribute("aria-expanded", String(!menu.hidden));
});

document.addEventListener("click", event => {
  if (!event.target.closest(".wrap")) {
    closeMenu();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeMenu();
  }
});

/* BEHEER UITKLAPPEN */
document.getElementById("manageToggle").addEventListener("click", () => {
  editor.hidden = !editor.hidden;
});

/* NIEUWE STATUS TOEVOEGEN */
document.getElementById("addBtn").addEventListener("click", async () => {
  const input = document.getElementById("newName");
  const name = input.value.trim();

  if (!name) return;

  const newId = "status-" +
    Date.now() + "-" +
    Math.random().toString(16).slice(2);

  statuses.push({
    id: newId,
    name: name,
    color: "#64748b"
  });

  input.value = "";

  render();
  editor.hidden = false;

  await persist();
});

/* WIJZIGINGEN VAN COLLEGA'S ONTVANGEN */
function subscribeToChanges() {
  db.channel("status-" + pageId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "outline_statuses",
        filter: "page_id=eq." + pageId
      },
      payload => {
        if (!payload.new) return;

        const newStatuses = payload.new.statuses;

        if (!Array.isArray(newStatuses) || newStatuses.length === 0) {
          return;
        }

        statuses = newStatuses;

        selected = statuses.some(s => s.id === payload.new.selected)
          ? payload.new.selected
          : statuses[0].id;

        render();
      }
    )
    .subscribe();
}

/* START */
async function start() {
  await loadStatus();

  if (ready) {
    subscribeToChanges();
  }
}

start();
</script>
</body>
</html>
